services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: privface
      POSTGRES_USER: privface
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - privface_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U privface -d privface']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  privface_postgres:
